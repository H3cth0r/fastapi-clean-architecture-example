[tool.poetry]
name = "example"
version = "1.0.0"
description = "Clean Architecture example with FastAPI and Tasks CRUD"
authors = ["'Ós' <oscar@summit-mgmt.mx>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.8.2"
pydantic-settings = "^2.3.4"
tortoise-orm = "^0.21.0"
aerich = "^0.7.2"
asyncpg = "^0.29.0"
python-dotenv = "^1.0.0"
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
pytest-xdist = "^3.6.1"
hypothesis = "^6.105.1"
factory-boy = "^3.3.0"
async-factory-boy = "^1.0.1"

[tool.poetry.group.dev.dependencies]
black = "^24.4.0"
isort = "^5.13.0"
mypy = "^1.10.0"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.aerich]
tortoise_orm = "api.misc.config.TORTOISE_ORM"
location = "./api/migrations"
src_folder = "./."

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "conftest.py",
    "*/fakers.py",
    "*/strategies.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
