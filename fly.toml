app = 'clean-architecture-example'
primary_region = 'dfw'

[build]
dockerfile = "./Dockerfile"

[env]
ENVIRONMENT = "production"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1

[deploy]
release_command = "sh ./api/scripts/aerich_init.sh"
strategy = "bluegreen"

[[http_service.checks]]
grace_period = "1m20s"
interval = "10s"
method = "GET"
timeout = "10s"
path = "/health"

[experimental]
cmd = ["python", "-m", "api.app"]
